# Application Configuration
spring.application.name=aml-fraud-detector
server.port=${SERVER_PORT:2637}
server.servlet.context-path=${CONTEXT_PATH:/api/v1}


# Internationalization (i18n) Configuration
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true
spring.messages.cache-duration=3600

# Default Locale
spring.web.locale=en
spring.web.locale-resolver=fixed

# Virtual Threads (Project Loom) - requires Java 21+ runtime.
# Serves every HTTP request on its own virtual thread (near-unbounded cheap concurrency for
# blocking I/O: JPA, Aerospike, Neo4j, Kafka, external screening/regulator calls) and makes
# @Scheduled and the default @Async executor use virtual threads too. On a Java <21 runtime
# this flag is silently ignored, so it is safe to leave enabled everywhere.
spring.threads.virtual.enabled=${VIRTUAL_THREADS_ENABLED:true}

# Tomcat Thread Pool Configuration (Ultra High Throughput - 30K+ requests)
# NB: with virtual threads enabled the request-processing pool is a per-request virtual-thread
# executor; the platform-thread settings below still cap connections/accept backlog.
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:200}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:1000}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:5000}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:20000}
server.tomcat.keep-alive-timeout=${TOMCAT_KEEPALIVE_TIMEOUT:60000}
server.tomcat.max-keep-alive-requests=${TOMCAT_MAX_KEEPALIVE:1000}

# HTTP/2 Support - Dynamic Auto-Detection and Failover
server.http2.enabled=${HTTP2_ENABLED:false}

# HTTP/2 Auto-Detection Configuration
http2.auto.detect.enabled=${HTTP2_AUTO_DETECT_ENABLED:true}
http2.detection.test.url=${HTTP2_DETECTION_TEST_URL:http://localhost:8080/actuator/health}
http2.detection.timeout.ms=${HTTP2_DETECTION_TIMEOUT:5000}
http2.detection.refresh.interval.seconds=${HTTP2_DETECTION_REFRESH_INTERVAL:300}

# HTTP/2 Health Monitoring Configuration
http2.health.monitoring.enabled=${HTTP2_HEALTH_MONITORING_ENABLED:true}
http2.health.check.interval.seconds=${HTTP2_HEALTH_CHECK_INTERVAL:30}
http2.failover.drop.threshold=${HTTP2_FAILOVER_DROP_THRESHOLD:10}
http2.failover.error.rate.threshold=${HTTP2_FAILOVER_ERROR_RATE_THRESHOLD:0.05}
http2.failover.latency.threshold.ms=${HTTP2_FAILOVER_LATENCY_THRESHOLD:1000}

# HTTP/2 Failover Configuration
http2.failover.enabled=${HTTP2_FAILOVER_ENABLED:true}
http2.failover.retry.interval.seconds=${HTTP2_FAILOVER_RETRY_INTERVAL:300}
http2.failover.min.retry.interval.seconds=${HTTP2_FAILOVER_MIN_RETRY_INTERVAL:60}
http2.failover.auto.retry.enabled=${HTTP2_FAILOVER_AUTO_RETRY_ENABLED:true}

# HTTP/2 Network Stability Configuration (Background Process)
http2.network.stability.enabled=${HTTP2_NETWORK_STABILITY_ENABLED:true}
http2.network.stability.check.interval.seconds=${HTTP2_NETWORK_STABILITY_CHECK_INTERVAL:30}
http2.network.stability.test.url=${HTTP2_NETWORK_STABILITY_TEST_URL:http://localhost:8080/actuator/health}
http2.network.stability.timeout.ms=${HTTP2_NETWORK_STABILITY_TIMEOUT:5000}
http2.network.stability.success.threshold=${HTTP2_NETWORK_STABILITY_SUCCESS_THRESHOLD:5}
http2.network.stability.failure.threshold=${HTTP2_NETWORK_STABILITY_FAILURE_THRESHOLD:3}

# Compression
server.compression.enabled=${COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.showCommonExtensions=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.config-url=/api-docs/swagger-config
springdoc.swagger-ui.validator-url=
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.paths-to-match=/api/v1/**
springdoc.packages-to-scan=com.posgateway.aml.controller
springdoc.show-actuator=false

# =============================================================================
# Database Configuration
# =============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aml_fraud_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
# Ensure JPA waits for Flyway to complete migrations
spring.jpa.defer-datasource-initialization=false

# Hibernate Envers Configuration
spring.jpa.properties.hibernate.envers.store_data_at_delete=false

# Flyway Configuration
# NOTE: db/migration is the prod-safe baseline. db/migration-dev contains
# seed data (V99 dummy credentials, V107 sample data) and MUST NOT be loaded
# on prod. Profile-specific properties files override `spring.flyway.locations`
# to either include or exclude db/migration-dev. See:
#   application-dev.properties           -> includes migration-dev
#   application-production.properties    -> migration only (no seed data)
#   application-testenv.properties       -> Flyway disabled (Hibernate ddl)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration
# Tolerate previously-applied seed migrations (V99/V107) that are now optional
# and may be absent from the active locations on prod. Without this, a prod
# DB cloned from a dev DB would fail validation on boot.
spring.flyway.ignore-missing-migrations=true
spring.flyway.encoding=UTF-8
spring.flyway.detect-encoding=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.placeholder-replacement=false

# Database Query Logging (for performance optimization)
spring.jpa.properties.hibernate.show_sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${HIBERNATE_USE_SQL_COMMENTS:true}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG_LEVEL:WARN}
# Suppress Hibernate Envers metamodel warning (HHH015007) - known compatibility issue, doesn't affect functionality
logging.level.org.hibernate.metamodel.internal.MetadataContext=ERROR
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_STATISTICS:false}
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=${SLOW_QUERY_THRESHOLD:1000}

# =============================================================================
# Neo4j Graph Database Configuration (Community Edition)
# =============================================================================
neo4j.enabled=${NEO4J_ENABLED:false}
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password}
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}

# =============================================================================
# AML Microservice Client (replaces in-process Aerospike; Aerospike now lives
# inside aml-microservice and is reached over HTTP with a circuit breaker).
# =============================================================================
aml.microservice.base-url=${AML_MICROSERVICE_URL:http://aml-ms:8091}
aml.microservice.enabled=${AML_MICROSERVICE_ENABLED:false}
aml.microservice.internal-auth-key=${AML_MS_INTERNAL_KEY:}
# Shared key accepted by BACKEND-only internal endpoints. It intentionally uses the
# same deployment secret as the aml-microservice client.
aml.internal-auth-key=${AML_MS_INTERNAL_KEY:}
aml.microservice.connect-timeout-ms=200
aml.microservice.read-timeout-ms=400

# Overall decision blend (KRS + transaction rules + CRA + ML). The service
# normalizes these values by their sum.
risk.weights.krs=${RISK_WEIGHT_KRS:0.25}
risk.weights.trs=${RISK_WEIGHT_TRS:0.35}
risk.weights.cra=${RISK_WEIGHT_CRA:0.25}
risk.weights.ml=${RISK_WEIGHT_ML:0.15}

# Annual card billing. A blank gateway URL disables outbound card charges.
billing.card.gateway-url=${BILLING_CARD_GATEWAY_URL:}
billing.mpesa.enabled=${BILLING_MPESA_ENABLED:true}

# Resilience4j circuit breaker / time limiter / retry for the AML microservice client
resilience4j.circuitbreaker.instances.amlMicroservice.sliding-window-size=20
resilience4j.circuitbreaker.instances.amlMicroservice.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.amlMicroservice.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.amlMicroservice.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.instances.amlMicroservice.timeout-duration=500ms
resilience4j.retry.instances.amlMicroservice.max-attempts=2
resilience4j.retry.instances.amlMicroservice.wait-duration=50ms

# W14-5 fix: sanctions screening previously shared the "amlMicroservice" breaker above with the
# unrelated AML risk-scoring path (ScoringService). SanctionsController legitimately returns 503
# for its own UNAVAILABLE status, and Resilience4j breaker instances are shared by name across the
# whole app regardless of which client class references them -- a burst of sanctions-service 503s
# opened the shared breaker and degraded AML risk scoring too, even though nothing was actually
# wrong with that path. Same settings as amlMicroservice, just decoupled under its own name.
resilience4j.circuitbreaker.instances.sanctionsScreening.sliding-window-size=20
resilience4j.circuitbreaker.instances.sanctionsScreening.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sanctionsScreening.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.sanctionsScreening.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.instances.sanctionsScreening.timeout-duration=500ms
resilience4j.retry.instances.sanctionsScreening.max-attempts=2
resilience4j.retry.instances.sanctionsScreening.wait-duration=50ms

# =============================================================================
# Sumsub KYC Configuration — REMOVED
# The external Sumsub KYC vendor has been removed. AML/sanctions screening runs
# entirely on the platform's own independent engine (aml-microservice). This flag
# stays false and is no longer consulted by any bean.
# =============================================================================
sumsub.enabled=false

# KYC document evidence storage and malware scanning. Production deployments
# set antivirus.required=true and connect to the private clamd service.
app.document.upload-dir=${DOCUMENT_UPLOAD_DIR:./uploads}
app.document.max-size-bytes=${DOCUMENT_MAX_SIZE_BYTES:10485760}
app.document.antivirus.enabled=${DOCUMENT_ANTIVIRUS_ENABLED:false}
app.document.antivirus.required=${DOCUMENT_ANTIVIRUS_REQUIRED:false}
app.document.antivirus.host=${DOCUMENT_ANTIVIRUS_HOST:localhost}
app.document.antivirus.port=${DOCUMENT_ANTIVIRUS_PORT:3310}
app.document.antivirus.timeout-ms=${DOCUMENT_ANTIVIRUS_TIMEOUT_MS:10000}

# =============================================================================
# Sanctions Screening Configuration
# =============================================================================
# Sanctions Download
sanctions.download.enabled=${SANCTIONS_DOWNLOAD_ENABLED:false}
sanctions.opensanctions.url=${SANCTIONS_OPENSANCTIONS_URL:https://api.opensanctions.org/datasets/latest/default/entities.json}
sanctions.opensanctions.metadata.url=${SANCTIONS_OPENSANCTIONS_METADATA_URL:https://api.opensanctions.org/datasets/latest/default/index.json}

# Name Matching Thresholds
sanctions.matching.levenshtein.threshold=${SANCTIONS_LEVENSHTEIN_THRESHOLD:3}
sanctions.matching.similarity.threshold=${SANCTIONS_SIMILARITY_THRESHOLD:0.8}

# Real-time Screening
