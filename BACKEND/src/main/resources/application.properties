adverse.media.timeout=${ADVERSE_MEDIA_TIMEOUT:8s}
corporate.intelligence.refresh-cron=${CORPORATE_INTELLIGENCE_REFRESH_CRON:0 30 2 * * *}
corporate.intelligence.clear-review-days=${CORPORATE_INTELLIGENCE_CLEAR_REVIEW_DAYS:30}
corporate.intelligence.exception-review-days=${CORPORATE_INTELLIGENCE_EXCEPTION_REVIEW_DAYS:3}
corporate.intelligence.batch-size=${CORPORATE_INTELLIGENCE_BATCH_SIZE:100}

# QuickFIX/J market order and execution feed. The engine stays disabled until
