[package]
name = "hse-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

# HSE-1 edge (open) side. Mirrors BACKEND .../edge/crypto/HokekaSecureEnvelope.java byte-for-byte.
[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[lib]
crate-type = ["rlib"]
