name: CI

# Runs the whole platform: control plane, PSP edge host, the Rust core, and the dashboard.
#
# The `edge-interop` job is the important one. HSE-1 is implemented twice — once in Java (control
# plane, seal side) and once in Rust (edge, open side) — and the two must stay byte-for-byte
# compatible or PSP nodes silently stop receiving rules. The Java test regenerates the interop vector
# from the CURRENT implementation and the Rust suite then opens it, so a wire-format change on either
# side fails here rather than in the field. Committing a vector without regenerating it would give a
# false green, which is exactly what this ordering prevents.

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  backend:
    name: Control plane (BACKEND)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - name: Test
        working-directory: BACKEND
        run: mvn -B --no-transfer-progress test
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: BACKEND/target/surefire-reports/
          if-no-files-found: warn

  aml-microservice:
    name: AeroORM adapter + AML microservice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      # The service consumes the vendored adapter as a normal Maven dependency, so install the
      # adapter into the runner's local repository before resolving the service build.
      - name: Build and install aeroorm-java
        working-directory: aeroorm-java
        run: mvn -B --no-transfer-progress install
      - name: Test AML microservice
        working-directory: aml-microservice
        run: mvn -B --no-transfer-progress test
      - name: Publish AML microservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml-microservice-surefire-reports
          path: aml-microservice/target/surefire-reports/
          if-no-files-found: warn

  edge-host:
    name: PSP edge host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - name: Test
        working-directory: edge-host
        run: mvn -B --no-transfer-progress test
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-host-surefire-reports
          path: edge-host/target/surefire-reports/
          if-no-files-found: warn

  edge-interop:
    name: HSE-1 Java-Rust interop + Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge-engine

      # Step 1 — regenerate the interop vector from the CURRENT Java implementation.
      # EdgeBundleServiceTest seals a real rule-IR bundle and writes edge-engine/test-vectors/.
      - name: Regenerate the HSE-1 interop vector from Java
        working-directory: BACKEND
        run: mvn -B --no-transfer-progress test -Dtest=EdgeBundleServiceTest -DfailIfNoSpecifiedTests=false

      - name: Fail if the vector was not regenerated
        run: |
          set -euo pipefail
          vector=edge-engine/test-vectors/hse1_vector.json
          test -f "$vector" || { echo "::error::$vector was not produced by the Java test"; exit 1; }
          # Must have been written by the step above, not merely checked out.
          if [ -z "$(find "$vector" -newermt '-10 minutes')" ]; then
            echo "::error::$vector is stale — the Java generator did not rewrite it, so the Rust interop test would validate against a snapshot instead of current Java."
            exit 1
          fi
          echo "vector regenerated: $(wc -c < "$vector") bytes"

      # Step 2 — the Rust edge must open what Java just sealed.
      - name: Rust workspace tests (incl. interop + no-plaintext proofs)
        working-directory: edge-engine
        run: cargo test --workspace --verbose

      - name: Clippy (warnings are errors)
        working-directory: edge-engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Formatting
        working-directory: edge-engine
        run: cargo fmt --all --check


  edge-native:
    # The on-prem engine ships to BOTH Windows and Linux customer estates, so the Rust core must
    # build — and its JNI boundary must actually execute — on both. Previously CI produced a Linux
    # .so only, so a Windows-only breakage (or an ABI/signature drift seen only there) would have
    # shipped undetected. System.loadLibrary("edge_engine") resolves the right filename per platform
    # (edge_engine.dll / libedge_engine.so), so one Java code path covers both.
    name: Native edge core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            libname: libedge_engine.so
            artifact: libedge_engine-linux-x86_64
          - os: windows-latest
            libname: edge_engine.dll
            artifact: edge_engine-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge-engine

      - name: Rust unit tests
        working-directory: edge-engine
        run: cargo test --workspace

      - name: Build the native core (cdylib)
        working-directory: edge-engine
        run: cargo build --release -p edge-jni

      - name: Verify the platform library was produced
        shell: bash
        run: |
          set -euo pipefail
          lib="edge-engine/target/release/${{ matrix.libname }}"
          test -f "$lib" || { echo "::error::${{ matrix.libname }} was not produced on ${{ matrix.os }}"; exit 1; }
          echo "built ${{ matrix.libname }} ($(wc -c < "$lib") bytes)"

      # Executes the real Java -> Rust JNI crossing against the freshly built library.
      - name: Exercise the JNI boundary
        working-directory: edge-host
        shell: bash
        run: >
          mvn -B --no-transfer-progress test -Pnative-core
          -Dnative.core.dir="${{ github.workspace }}/edge-engine/target/release"

      # The container image (jib) ships the Linux library inside it, so stage it there on the
      # Linux leg. Windows customers run the engine natively and receive the .dll artifact instead.
      - name: Stage the Linux library into the container image layout
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p edge-host/src/main/jib/opt/hokeka/lib
          cp "edge-engine/target/release/${{ matrix.libname }}" edge-host/src/main/jib/opt/hokeka/lib/
          echo "staged ${{ matrix.libname }} for the container image"

      - name: Upload the native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: edge-engine/target/release/${{ matrix.libname }}
          if-no-files-found: error

  frontend:
    name: Dashboard (FRONTEND)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - name: Install
        working-directory: FRONTEND
        run: npm ci
      - name: Type check
        working-directory: FRONTEND
        run: npm run typecheck
      - name: Lint (zero-warning policy)
        working-directory: FRONTEND
        run: npm run lint
      - name: Unit tests (vitest)
        working-directory: FRONTEND
        run: npm test
      - name: UI coverage matrix vs gap register (P0 routes)
        run: node scripts/verify-ui-coverage-matrix.mjs
      - name: Build
        working-directory: FRONTEND
        run: npm run build

  docs-site:
    name: Install docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        working-directory: docs-site
        run: npm ci
      - name: Build
        working-directory: docs-site
        run: npm run build

  website:
    name: Marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Build
        working-directory: website
        run: npm run build

  deploy-scripts:
    name: Edge installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        working-directory: edge-host/deploy
        run: bash -n install.sh
      - name: PowerShell syntax
        shell: pwsh
        working-directory: edge-host/deploy
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'install.ps1: SYNTAX OK'
      # The signature check is the only thing standing between a client and a tampered origin, and
      # it is easy to defeat by accident — reordering two lines so a digest is trusted before the
      # manifest is authenticated leaves every existing test passing.
      - name: Signature verification is wired in and ordered correctly
        working-directory: edge-host/deploy
        run: |
          set -euo pipefail
          grep -q '^verify_signature()' install.sh \
            || { echo "::error::verify_signature() is missing from install.sh"; exit 1; }

          sig_line=$(grep -n 'verify_signature "\$DOWNLOAD_DIR/SHA256SUMS"' install.sh | cut -d: -f1)
          fv_line=$(grep -n 'fetch_verified "edge-host.jar"' install.sh | cut -d: -f1)
          [ -n "$sig_line" ] || { echo "::error::download_artifacts never calls verify_signature"; exit 1; }
          [ "$sig_line" -lt "$fv_line" ] \
            || { echo "::error::SHA256SUMS is trusted before its signature is verified"; exit 1; }
          echo "signature verified at line $sig_line, before first artifact use at line $fv_line"

      # A glibc core cannot load on musl and vice versa; the failure mode is a SILENT fallback to
      # the slow Java interpreter. The installer must pick the core by libc, and must refuse only
      # the combination we publish nothing for (musl on ARM).
      - name: libc detection selects the right core
        working-directory: edge-host/deploy
        run: |
          set -euo pipefail
          sed -n '/^detect_libc() {/,/^}/p'        install.sh >  /tmp/libc.sh
          sed -n '/^detect_platform() {/,/^}/p'    install.sh >> /tmp/libc.sh
          sed -n '/^download_artifacts() {/,/^}/p' install.sh >  /tmp/dl.sh

          gate() { # gate <MODE> <musl?> <arch>
            MODE="$1" FAKE_MUSL="$2" FAKE_ARCH="$3" bash -c '
              PSPID=1; EDGEID=e; CONTROLPLANE=https://edge.hokeka.com
              log(){ :; }; ok(){ :; }; warn(){ :; }; die(){ exit 1; }
              ldd(){ if [ "$FAKE_MUSL" = 1 ]; then echo "musl libc"; else echo "ldd (GNU libc) 2.39"; fi; }
              uname(){ if [ "$1" = "-m" ]; then echo "$FAKE_ARCH"; else echo Linux; fi; }
              source /tmp/libc.sh; detect_platform' >/dev/null 2>&1
          }
          gate native 1 x86_64  || { echo "::error::--native wrongly refused on musl/x86_64 (a musl core IS published)"; exit 1; }
          gate native 1 aarch64 && { echo "::error::--native accepted on musl/aarch64 — no such core is published"; exit 1; } || true
          gate native 0 x86_64  || { echo "::error::--native wrongly refused on glibc"; exit 1; }
          gate container 1 aarch64 || { echo "::error::container mode wrongly refused on musl"; exit 1; }

          picked() { # picked <libc> <arch>
            LIBC="$1" ARCH="$2" bash -c '
              RESOLVED_VERSION=1.0.0; REPO_URL=http://x; OFFLINE=0; DOWNLOAD_DIR=$(mktemp -d)
              log(){ :; }; ok(){ :; }; die(){ exit 1; }
              detect_arch(){ :; }; resolve_version(){ :; }; fetch(){ :; }; verify_signature(){ :; }
              fetch_verified(){ echo "$1"; touch "$DOWNLOAD_DIR/$1"; }
              source /tmp/dl.sh; download_artifacts' | grep edge_engine
          }
          [ "$(picked glibc x86_64)" = "libedge_engine-linux-x86_64.so" ]      || { echo "::error::wrong core for glibc/x86_64"; exit 1; }
          [ "$(picked musl  x86_64)" = "libedge_engine-linux-x86_64-musl.so" ] || { echo "::error::wrong core for musl/x86_64"; exit 1; }
          [ "$(picked glibc aarch64)" = "libedge_engine-linux-aarch64.so" ]    || { echo "::error::wrong core for glibc/aarch64"; exit 1; }
          echo "libc gate + core selection verified"

      - name: Compose validity + database isolation
        working-directory: edge-host/deploy
        run: |
          set -euo pipefail
          cp .env.example .env 2>/dev/null || true
          docker compose config > /tmp/rendered.yml
          # The database must never be published to the host — isolation is the access control.
          if docker compose config --format json \
             | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; sys.exit(1 if s.get('aerospike',{}).get('ports') else 0)"; then
            echo "aerospike is network-isolated (no published ports)"
          else
            echo "::error::aerospike has published ports — the database would be reachable outside the app"
            exit 1
          fi
