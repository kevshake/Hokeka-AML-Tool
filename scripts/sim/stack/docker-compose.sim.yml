# Hokeka simulation stack — data services only. The Control Plane, aml-microservice and Edge Host
# run from the worktree (java -jar) so their logs land in scripts/sim/results/logs.
# Compose project name: hokeka-sim. Host ports are offset (5xxxx, bound to 127.0.0.1) so nothing
# collides with other local stacks (native Postgres :5432, timescale :55432, redis :6379).
name: hokeka-sim

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hokeka_sim
      POSTGRES_PASSWORD: hokeka_sim_pw
      POSTGRES_DB: fraud_detector_sim
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hokeka_sim -d fraud_detector_sim"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "127.0.0.1:59092:59092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:59092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Production sets this false. The sim reads KAFKA_AUTO_CREATE from the environment so the
      # run can be repeated both ways (missing topic provisioning shows up as a finding).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE:-true}"

  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:56379:6379"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/hokeka_sim_neo4j
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:57687:7687"
      - "127.0.0.1:57474:7474"

  aerospike:
    image: aerospike/aerospike-server:6.4
    command: ["--config-file", "/opt/aerospike/etc/sim/aerospike.conf"]
    volumes:
      - ./aerospike-sim.conf:/opt/aerospike/etc/sim/aerospike.conf:ro
    ports:
      - "127.0.0.1:53000:3000"
    healthcheck:
      test: ["CMD", "asinfo", "-p", "3000", "-v", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
