corporate.registry.enabled=${CORPORATE_REGISTRY_ENABLED:false}
corporate.registry.base-url=${CORPORATE_REGISTRY_BASE_URL:https://api.opencorporates.com}
corporate.registry.api-token=${OPENCORPORATES_API_TOKEN:}
corporate.registry.timeout=${CORPORATE_REGISTRY_TIMEOUT:5s}
adverse.media.enabled=${ADVERSE_MEDIA_ENABLED:false}
