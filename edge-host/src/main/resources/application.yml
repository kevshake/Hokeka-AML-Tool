server:
  # Bind address of the local transaction API. The container publishes it to 127.0.0.1 by default
  # (see deploy/docker-compose.yml, EDGE_BIND); widen only to a PSP-internal interface.
  address: ${EDGE_BIND_ADDRESS:0.0.0.0}
  port: ${EDGE_PORT:8443}
  ssl:
    # Real TLS terminates HERE — there is no sidecar and no plaintext fallback. EdgeTlsGuard refuses
    # to start if the keystore/password is missing (dev profile excepted, loudly).
    enabled: ${EDGE_TLS_ENABLED:true}
    key-store: ${EDGE_TLS_KEYSTORE:/opt/hokeka/secrets/edge-tls.p12}
    key-store-type: PKCS12
    key-store-password: ${EDGE_TLS_KEYSTORE_PASSWORD:}
    key-alias: ${EDGE_TLS_KEY_ALIAS:edge}
    protocol: TLS
    enabled-protocols: TLSv1.3
    ciphers: TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256
    # none | want | need. For mutual TLS from the PSP API nodes set EDGE_TLS_CLIENT_AUTH=need and
    # point SERVER_SSL_TRUST_STORE / SERVER_SSL_TRUST_STORE_PASSWORD at the PSP client-CA truststore.
    client-auth: ${EDGE_TLS_CLIENT_AUTH:none}

spring:
  application:
    name: hokeka-edge-host
  threads:
    virtual:
      enabled: true    # serve each transaction on a virtual thread (Java 21+); near-unbounded concurrency
  autoconfigure:
    # The Edge Ledger owns its DataSource and Flyway run (com.hokeka.edge.ledger.EdgeLedger), so a
    # database outage can never block boot; Boot's own DataSource/Flyway wiring must stay off.
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

hokeka:
  controlplane:
    enabled: ${EDGE_CONTROLPLANE_ENABLED:true}
    base-url: ${CONTROLPLANE_URL:}          # must be https:// — http is refused at startup
    edge-id: ${EDGE_EDGEID:}
    psp-id: ${EDGE_PSPID:}
    enrollment-code: ${EDGE_ENROLLMENT_CODE:}
    bundle-poll-interval: ${EDGE_BUNDLE_POLL_INTERVAL:15s}
    metrics-interval: ${EDGE_METRICS_INTERVAL:60s}
    # How often the Edge Ledger outbox (decision records v2, ids + outcome only) is drained to the
    # Control Plane. The records are durable in edge_outbox; this is only the polling cadence.
    assessment-ship-interval: ${EDGE_ASSESSMENT_SHIP_INTERVAL:2s}
    request-timeout: ${EDGE_CONTROLPLANE_TIMEOUT:20s}
    # mTLS identity presented to the control plane (contract §5).
    keystore: ${EDGE_MTLS_KEYSTORE:/opt/hokeka/secrets/edge-client.p12}
    keystore-password: ${EDGE_MTLS_KEYSTORE_PASSWORD:}
    truststore: ${EDGE_MTLS_TRUSTSTORE:}
    truststore-password: ${EDGE_MTLS_TRUSTSTORE_PASSWORD:}
    # Pinned control-plane keys (base64 SPKI or raw 32 bytes) — trust anchors for HSE-1.
    signing-public-key: ${CONTROLPLANE_ED25519_PUBLIC_KEY:}
    encryption-public-key: ${CONTROLPLANE_X25519_PUBLIC_KEY:}
    identity-file: ${EDGE_IDENTITY_FILE:/opt/hokeka/secrets/edge-identity.json}
    # Last verified rule IR. Empty = rule-bundle.ir beside the identity file.
    bundle-file: ${EDGE_RULE_BUNDLE_FILE:}
  # Edge Ledger (EDGE_DATA_RESIDENCY_CONTRACT.md §1): the site's PostgreSQL 16 system of record for
  # evaluations + the decision-record outbox. URL/user/password have no defaults: when one is
  # missing the node logs WHICH variable is missing (never a value) and, fail-closed, answers HOLD.
  ledger:
    url: ${EDGE_LEDGER_URL:}
    username: ${EDGE_LEDGER_USER:}
    password: ${EDGE_LEDGER_PASSWORD:}
    schema: ${EDGE_LEDGER_SCHEMA:edge_ledger}
    # Edge Site id; empty = single-node site, site id = EDGE_EDGEID.
    site-id: ${EDGE_SITE_ID:}
    # true (default): a failed evaluation+outbox write answers HOLD / LEDGER_UNAVAILABLE.
    fail-closed: ${EDGE_LEDGER_FAIL_CLOSED:true}
    pool-size: ${EDGE_LEDGER_POOL_SIZE:16}
    connection-timeout: ${EDGE_LEDGER_CONNECTION_TIMEOUT:1000ms}
    write-timeout: ${EDGE_LEDGER_WRITE_TIMEOUT:2s}
    partition-months-ahead: ${EDGE_LEDGER_PARTITION_MONTHS_AHEAD:3}
    retry-buffer-size: ${EDGE_LEDGER_RETRY_BUFFER_SIZE:10000}
    outbox-batch-size: ${EDGE_LEDGER_OUTBOX_BATCH_SIZE:500}
    # Separate read pool for Edge Tunnel requests (never starves the evaluate path).
    read-pool-size: ${EDGE_LEDGER_READ_POOL_SIZE:4}
    # Retention (contract §6.3, §8.2): effective = max(config retention.years, this floor). Below 5 is
    # ignored with a warning. Nothing is purged before the first Edge config document is accepted.
    retention-min-years: ${EDGE_RETENTION_MIN_YEARS:5}
    # Daily purge at this site-local time; EDGE_SITE_TIMEZONE is an IANA id (blank = host zone).
    purge-time: "${EDGE_PURGE_TIME:02:00}"
    site-timezone: ${EDGE_SITE_TIMEZONE:}
  # Edge Tunnel client (contract §7). Local settings can only narrow what the Control Plane allows.
  tunnel:
    # false = never connect: the Console shows this site offline (§7.6.1).
    enabled: ${EDGE_TUNNEL_ENABLED:true}
    # Comma-separated ops this node serves; blank = every implemented op.
    ops: ${EDGE_TUNNEL_OPS:}
    # Blank = derived from CONTROLPLANE_URL (https://host → wss://host/api/v1/edge/tunnel).
    url: ${EDGE_TUNNEL_URL:}
    max-inflight: ${EDGE_TUNNEL_MAX_INFLIGHT:16}
    # Blank = the jar's Implementation-Version.
    agent-version: ${EDGE_AGENT_VERSION:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true  # /actuator/health/liveness + /readiness for K8s
