# =============================================================================
# NGINX vhost: edge.hokeka.com — Edge channel (mTLS) incl. the Edge Tunnel WebSocket
#
# Normative: docs/EDGE_DATA_RESIDENCY_CONTRACT.md §7.1 (tunnel transport) and
# docs/architecture/edge-channel-contract.md (mTLS identity). Backend: Spring Boot on
# 127.0.0.1:2637 (context path /api/v1).
#
#   wss://edge.hokeka.com/api/v1/edge/tunnel   WebSocket, subprotocol hokeka-tunnel.v1
#   https://edge.hokeka.com/api/v1/edge/{bundle,config,metrics,assessments}
#
# How identity reaches the Control Plane
#   nginx terminates TLS 1.3 and REQUIRES a client certificate issued by the Hokeka Edge CA
#   (ssl_verify_client on). It forwards the verification result and the subject DN as
#   X-SSL-Client-Verify / X-SSL-Client-S-DN; EdgeIdentityResolver honours those headers ONLY
#   from edge.mtls.trusted-proxies (default 127.0.0.1 / ::1), takes the edge id from the CN,
#   cross-checks X-Hokeka-Edge-Id, and requires the node ACTIVE before the 101 is sent.
#   proxy_set_header always OVERWRITES the two headers, so a client cannot inject them here;
#   fraud-detector-api.conf strips them on every other vhost.
#
# Deployment
#   1. Install the Edge client-certificate CA bundle at /etc/nginx/hokeka/edge-client-ca.pem
#      (and, if used, the CRL at /etc/nginx/hokeka/edge-client-ca.crl — uncomment ssl_crl).
#   2. Install the server certificate for edge.hokeka.com (Let's Encrypt paths below).
#   3. Include this file from nginx.conf's http {} block next to fraud-detector-api.conf
#      (the "upstream fraud_detector_backend" defined there is NOT reused, so this file is
#      self-contained), then: nginx -t && systemctl reload nginx
#   4. DNS: edge.hokeka.com → this host. PSP firewalls need egress TCP 443 only (§1 I3).
#   5. Every Control Plane instance needs Redis (registry + relay) and an identical
#      EDGE_BUNDLE_SIGNING_KEY / EDGE_METRICS_INGEST_KEY; set EDGE_TUNNEL_INSTANCE_ID per instance.
#
# Notes
#   - WebSocket over HTTP/2 (RFC 8441) is not supported by nginx and the JDK client uses
#     HTTP/1.1 Upgrade, so this server does not enable http2 (nginx >= 1.25.1: "http2 off" is
#     the default per server; older nginx: keep "http2" off this listen line).
#   - Compression extensions are not used on the tunnel (§7.1): Sec-WebSocket-Extensions is
#     dropped here and the Control Plane declines extensions as well.
#   - proxy_read_timeout must exceed the 60 s tunnel idle timeout; the Edge pings every 20 s.
#   - /edge/enroll is NOT served here: a node enrolls (enrollment code) on api.hokeka.com.
# =============================================================================

upstream hokeka_edge_control_plane {
    server 127.0.0.1:2637;
    keepalive 32;
}

# Connection header for the upstream: "upgrade" for WebSocket handshakes, keep-alive otherwise.
map $http_upgrade $hokeka_edge_connection {
    default upgrade;
    ''      '';
}

limit_conn_zone $ssl_client_s_dn zone=edge_conn_per_node:10m;
limit_req_zone  $ssl_client_s_dn zone=edge_req_per_node:10m rate=600r/m;

server {
    listen 80;
    server_name edge.hokeka.com;
    return 403;
}

server {
    listen 443 ssl;
    server_name edge.hokeka.com;

    # ── TLS 1.3 + mandatory client certificate ───────────────────────────────────────────────
    ssl_certificate         /etc/letsencrypt/live/edge.hokeka.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/edge.hokeka.com/privkey.pem;
    ssl_protocols           TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:EDGE_SSL:10m;
    ssl_session_timeout     1h;
    ssl_session_tickets     off;

    ssl_client_certificate  /etc/nginx/hokeka/edge-client-ca.pem;
    ssl_verify_client       on;
    ssl_verify_depth        2;
    # ssl_crl               /etc/nginx/hokeka/edge-client-ca.crl;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/hokeka-edge-access.log;
    error_log  /var/log/nginx/hokeka-edge-error.log;

    # Decision-record / metrics envelopes are capped at 256 KiB by the Control Plane
    # (edge.metrics.max-payload-bytes); allow a margin, never more.
    client_max_body_size 512k;

    # ── Edge Tunnel WebSocket (§7.1) ─────────────────────────────────────────────────────────
    location = /api/v1/edge/tunnel {
        limit_conn edge_conn_per_node 4;

        proxy_pass http://hokeka_edge_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $hokeka_edge_connection;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Verified client identity (overwrites anything the client sent).
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;

        # §7.1: no compression extensions on the tunnel.
        proxy_set_header Sec-WebSocket-Extensions "";

        # Long-lived, bidirectional, unbuffered.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_connect_timeout   10s;
        proxy_read_timeout      90s;
        proxy_send_timeout      90s;
    }

    # ── HTTPS edge endpoints (bundle / config / metrics / decision records) ─────────────────
    location ~ ^/api/v1/edge/(bundle|config|metrics|assessments)$ {
        limit_req zone=edge_req_per_node burst=60 nodelay;

        proxy_pass http://hokeka_edge_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Nothing else is reachable on the edge vhost (no Console, no user API, no actuator).
    location / {
        return 404;
    }
}
