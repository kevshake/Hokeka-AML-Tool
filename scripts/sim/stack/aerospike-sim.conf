# Aerospike config for the hokeka-sim stack.
# Two namespaces on one dev node:
#   aml_cache — cloud-side sanctions cache owned by aml-microservice
#   hokeka    — Edge Node feature store (in a real install this is a separate on-prem node)
service {
	proto-fd-max 15000
}
logging {
	console {
		context any info
	}
}
network {
	service {
		address any
		port 3000
		access-address 127.0.0.1
	}
	heartbeat {
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}
	fabric {
		address local
		port 3001
	}
}
namespace aml_cache {
	default-ttl 0
	memory-size 128M
	nsup-period 120
	replication-factor 1
	storage-engine memory
}
namespace hokeka {
	default-ttl 0
	memory-size 128M
	nsup-period 120
	replication-factor 1
	storage-engine memory
}
